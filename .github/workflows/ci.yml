name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[solver]"

      - name: Lint
        run: python -m ruff check src tests scripts integrations/pyrevit

      - name: Test
        run: python -m pytest -ra

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts integrations/pyrevit

      - name: Build package wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/rebar-wheels .

      - name: Validate production Compose
        run: docker compose --file compose.prod.yml config --quiet

      - name: Build production image
        run: docker build --tag qmonitoring-a101-web:ci .
