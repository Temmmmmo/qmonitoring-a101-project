name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qmonitoring-production
  cancel-in-progress: true

jobs:
  production:
    name: Production container
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on:
      - self-hosted
      - linux
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check deployment prerequisites
        run: |
          docker version
          docker compose version
          docker network inspect caddy_net >/dev/null
          docker volume create qmonitoring-engineering-inputs >/dev/null

      - name: Build tested application
        run: docker compose --project-name qmonitoring --file compose.prod.yml build

      # Optional, explicitly approved private data delivery. Original DXFs never enter Git.
      # With no asset configured, preserve the existing volume; UI reports unavailable
      # if the actual verified originals have not been installed by an operator.
      - name: Install verified original engineering files
        if: vars.ENGINEERING_INPUT_ASSET_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ASSET_ID: ${{ vars.ENGINEERING_INPUT_ASSET_ID }}
          INPUT_ARCHIVE_SHA256: ${{ vars.ENGINEERING_INPUT_ARCHIVE_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$INPUT_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          archive="$(mktemp "${RUNNER_TEMP}/qmonitoring-inputs.XXXXXX.zip")"
          trap 'rm -f "$archive"' EXIT
          curl --fail --silent --show-error --location --max-time 120 --max-filesize 125829120 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${INPUT_ASSET_ID}" \
            --output "$archive"
          echo "$INPUT_ARCHIVE_SHA256  $archive" | sha256sum --check --status
          chmod 644 "$archive"
          # /app is the rebar user's private home. Root with ALL capabilities dropped
          # cannot traverse it; the installer needs only installed modules and /input.zip.
          docker run --rm --user 0:0 --workdir /tmp --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "type=bind,source=$archive,target=/input.zip,readonly" \
            --mount type=volume,source=qmonitoring-engineering-inputs,target=/engineering-inputs \
            qmonitoring-a101-web:latest \
            python -m rebar.application.engineering_example /input.zip /engineering-inputs

      # Independent opt-in S1 asset: never replace the installed K09 directory.
      # Configure only after private delivery has been explicitly approved.
      - name: Install verified S1 original files
        if: vars.S1_ENGINEERING_INPUT_ASSET_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ASSET_ID: ${{ vars.S1_ENGINEERING_INPUT_ASSET_ID }}
          INPUT_ARCHIVE_SHA256: ${{ vars.S1_ENGINEERING_INPUT_ARCHIVE_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$INPUT_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          archive="$(mktemp "${RUNNER_TEMP}/qmonitoring-s1-inputs.XXXXXX.zip")"
          trap 'rm -f "$archive"' EXIT
          curl --fail --silent --show-error --location --max-time 120 --max-filesize 125829120 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${INPUT_ASSET_ID}" \
            --output "$archive"
          echo "$INPUT_ARCHIVE_SHA256  $archive" | sha256sum --check --status
          chmod 644 "$archive"
          docker run --rm --user 0:0 --workdir /tmp --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "type=bind,source=$archive,target=/input.zip,readonly" \
            --mount type=volume,source=qmonitoring-engineering-inputs,target=/engineering-inputs \
            qmonitoring-a101-web:latest \
            python -m rebar.application.engineering_example /input.zip /engineering-inputs \
              --example-id legacy-s1-t800

      - name: Deploy
        run: >-
          docker compose
          --project-name qmonitoring
          --file compose.prod.yml
          up --detach --no-build --remove-orphans --wait --wait-timeout 120

      - name: Verify original files through the running application
        if: vars.ENGINEERING_INPUT_ASSET_ID != ''
        run: |
          docker compose --project-name qmonitoring --file compose.prod.yml \
            exec -T qmonitoring-web python - <<'PY'
          import json
          import urllib.request
          from rebar.application.engineering_example import EXAMPLE_ID, SOURCES

          with urllib.request.urlopen('http://127.0.0.1:8000/api/engineering-examples', timeout=10) as response:
              catalog = json.load(response)
          example = next(item for item in catalog['examples'] if item['id'] == EXAMPLE_ID)
          assert example['is_available'] is True, example['status']
          assert example['status'] == 'ready', example['status']
          assert example['source_kind'] == 'real_engineering_files'
          expected = {(layer, axis, name, digest) for layer, axis, name, digest in SOURCES}
          actual = {(item['direction']['layer'], item['direction']['axis'],
                     item['dxf_filename'], item['sha256']) for item in example['sources']}
          assert len(example['sources']) == 4 and actual == expected
          print('Running API confirms: K09 ready; four original DXFs match expected SHA256.')
          PY

      - name: Verify S1 originals through the running application
        if: vars.S1_ENGINEERING_INPUT_ASSET_ID != ''
        run: |
          docker compose --project-name qmonitoring --file compose.prod.yml \
            exec -T qmonitoring-web python - <<'PY'
          import json
          import urllib.request
          from rebar.application.s1_example import EXAMPLE_ID, SOURCES

          with urllib.request.urlopen('http://127.0.0.1:8000/api/engineering-examples', timeout=10) as response:
              catalog = json.load(response)
          example = next(item for item in catalog['examples'] if item['id'] == EXAMPLE_ID)
          assert example['is_available'] is True, example['status']
          assert example['status'] == 'ready', example['status']
          assert example['source_kind'] == 'real_engineering_files'
          expected = {(layer, axis, name, digest) for layer, axis, name, digest in SOURCES}
          actual = {(item['direction']['layer'], item['direction']['axis'],
                     item['dxf_filename'], item['sha256']) for item in example['sources']}
          assert len(example['sources']) == 4 and actual == expected
          print('Running API confirms: S1 ready; four original DXFs match expected SHA256.')
          PY

      - name: Show deployed service
        if: always()
        run: >-
          docker compose
          --project-name qmonitoring
          --file compose.prod.yml
          ps
