[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebar-autolayout"
version = "0.1.0"
description = "Auto-layout of additional rebar from LIRA-SAPR mosaics (Qmonitoring × A101)"
requires-python = ">=3.10"

[project.optional-dependencies]
solver = ["scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rebar.web" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# CLI запускаются прямо из checkout и до импортов добавляют локальный src/ в sys.path.
"scripts/*.py" = ["E402"]
